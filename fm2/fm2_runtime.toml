## Runtime config template - copied to the build dir as fm2.toml.
# The launcher supplies game_data_root so this file remains machine-independent.
log_file = "fm2.log"
gpu_plugin = "xenos"
gpu_allow_invalid_fetch_constants = true
allow_game_relative_writes = true
# Read-only DLC diagnostics. Enable for an operator-approved diagnostic run.
fm2_content_trace = false
