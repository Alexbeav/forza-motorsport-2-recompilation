## Runtime config template - copied to the build dir as fm2.toml.
# The launcher supplies game_data_root so this file remains machine-independent.
log_file = "fm2.log"
gpu_plugin = "xenos"
gpu_allow_invalid_fetch_constants = true
allow_game_relative_writes = true
# 2x scaling failed visual correctness on the source candidate. Keep native scale.
resolution_scale = 1
draw_resolution_scale_x = 1
draw_resolution_scale_y = 1
# Run-Local writes the requested -TraceContent value into the runtime copy.
fm2_content_trace = false
