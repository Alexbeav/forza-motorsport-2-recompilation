# Mid-asm hooks (game patches). Kept separate from fm2_functions.toml
# because the heal loop appends [functions] entries at that file's EOF.

# sub_824530F0 makes a static host call into the guest's non-local context
# switch. Preserve the old caller's ABI-nonvolatile state so its generated
# epilogue does not resume on the newly loaded guest stack/register context.
[[midasm_hook]]
name = "SaveContextSwitchCaller"
address = 0x82453110
registers = [
  "r1", "r14", "r15", "r16", "r17", "r18", "r19", "r20", "r21", "r22",
  "r23", "r24", "r25", "r26", "r27", "r28", "r29", "r30", "r31",
  "cr2", "cr3", "cr4",
  "f14", "f15", "f16", "f17", "f18", "f19", "f20", "f21", "f22",
  "f23", "f24", "f25", "f26", "f27", "f28", "f29", "f30", "f31",
  "v20", "v21", "v22", "v23", "v24", "v25", "v26", "v27", "v28",
  "v29", "v30", "v31"
]

[[midasm_hook]]
name = "RestoreContextSwitchCaller"
address = 0x82453114
registers = [
  "r1", "r14", "r15", "r16", "r17", "r18", "r19", "r20", "r21", "r22",
  "r23", "r24", "r25", "r26", "r27", "r28", "r29", "r30", "r31",
  "cr2", "cr3", "cr4",
  "f14", "f15", "f16", "f17", "f18", "f19", "f20", "f21", "f22",
  "f23", "f24", "f25", "f26", "f27", "f28", "f29", "f30", "f31",
  "v20", "v21", "v22", "v23", "v24", "v25", "v26", "v27", "v28",
  "v29", "v30", "v31"
]
