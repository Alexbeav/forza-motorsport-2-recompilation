# Mid-asm hooks (game patches). Kept separate from fm2_functions.toml
# because the heal loop appends [functions] entries at that file's EOF.

# sub_82756590 saves the outgoing guest fiber context and loads another one.
# A direct generated C++ call cannot itself move the host call stack, so pair
# the guest switch with the SDK's host-fiber primitive. The first hook records
# the outgoing/target guest context keys; the second switches host stacks after
# all target registers have been loaded and immediately before the tail call to
# KeSetCurrentStackPointers.
[[midasm_hook]]
name = "CaptureGuestFiberSwitch"
address = 0x82756598
registers = ["r3", "r5"]

[[midasm_hook]]
name = "CommitGuestFiberSwitch"
address = 0x827567D0
registers = ["r3"]

# Developer-only fast iteration path. FM2 already owns this decision through
# its `disablesplashintro` boolean. These hooks override the two reads of that
# boolean only when FM2_SKIP_INTRO=1 is present in the host environment, so
# normal launches retain the retail splash/movie state machine unchanged.
[[midasm_hook]]
name = "ApplyDeveloperSplashSkipAtStartup"
address = 0x8221504C
registers = ["r11"]

[[midasm_hook]]
name = "ApplyDeveloperSplashSkipAtCleanup"
address = 0x82216BB8
registers = ["r11"]
